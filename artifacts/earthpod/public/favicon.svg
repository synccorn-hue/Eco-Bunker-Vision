<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Dark earth background -->
  <rect width="64" height="64" fill="#1A120C"/>
  <!-- Outer ring (viewfinder / lens) -->
  <circle cx="32" cy="32" r="24" stroke="#C9A96E" stroke-width="1.5" fill="none" opacity="0.8"/>
  <!-- Inner dot (pupil / focal point) -->
  <circle cx="32" cy="32" r="6" fill="#C9A96E" opacity="0.9"/>
  <!-- Horizontal crosshair lines -->
  <line x1="8" y1="32" x2="22" y2="32" stroke="#C9A96E" stroke-width="1.2" opacity="0.5"/>
  <line x1="42" y1="32" x2="56" y2="32" stroke="#C9A96E" stroke-width="1.2" opacity="0.5"/>
  <!-- Vertical crosshair lines -->
  <line x1="32" y1="8" x2="32" y2="22" stroke="#C9A96E" stroke-width="1.2" opacity="0.5"/>
  <line x1="32" y1="42" x2="32" y2="56" stroke="#C9A96E" stroke-width="1.2" opacity="0.5"/>
</svg>
